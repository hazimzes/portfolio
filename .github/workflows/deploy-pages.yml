name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          grep -q '^SESSION_DRIVER=' .env || echo 'SESSION_DRIVER=cookie' >> .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          touch database/database.sqlite
          php artisan key:generate
      - run: npm ci
      - name: Diagnose render
        if: runner.debug == '1'
        run: echo skipped
      - run: npm run build
      - name: Mirror rendered site to static files
        run: |
          php artisan serve --host 127.0.0.1 --port 8090 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8090/ > /dev/null && break
            sleep 1
          done
          curl -s http://127.0.0.1:8090/ | grep -oE "<title>[^<]*|class=\"[^"]*exception[^"]*\"|<h1[^>]*>[^<]*" | head -5 || true
          curl -s http://127.0.0.1:8090/ | head -c 1500 || true
          echo ""
          tail -30 storage/logs/laravel.log 2>/dev/null || true
          tail -5 /tmp/serve.log || true
          # robots=off: wget's automatic /robots.txt request 404s on Laravel (no route).
          wget -o /tmp/wget.log --mirror --convert-links --adjust-extension --page-requisites --no-parent -e robots=off http://127.0.0.1:8090/ \
            || { tail -30 /tmp/wget.log; exit 1; }
          mkdir out
          cp "127.0.0.1:8090/index.html" out/
          cp -r public/build public/images public/files out/
          cp public/favicon.ico public/robots.txt out/ 2>/dev/null || true
          node scripts/rewrite-base-url.cjs out http://127.0.0.1:8090 /portfolio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
